<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CogniSpace — The AI workspace for notes and sprints</title>
    <meta name="description" content="CogniSpace is a fast, Notion-style workspace with an AI copilot, version history and a sprint board. Free to try." />
    <meta property="og:title" content="CogniSpace — The AI workspace for notes and sprints" />
    <meta property="og:description" content="Write, plan and ship in one calm workspace with an AI copilot that edits alongside you." />
    <meta name="theme-color" content="#0a0a0d" />
    <script>try{var t=localStorage.getItem("cs-theme");if(t==="light"||t==="dark")document.documentElement.setAttribute("data-theme",t);else if(window.matchMedia("(prefers-color-scheme: light)").matches)document.documentElement.setAttribute("data-theme","light")}catch(e){}</script>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
