name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck and build
        run: npm run build
      - name: API tests (embedded MongoDB)
        run: npm test
      - name: Install Chromium for the browser test
        run: npx playwright install --with-deps chromium
      - name: End-to-end journey (real browser, real server)
        run: npm run test:e2e
