name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
        continue-on-error: true # tighten to a hard failure once the baseline is clean
      - name: Typecheck and build
        run: npm run build
      - name: Backend syntax check
        run: node --check server/server.js && node --check server/controllers/aiController.js
