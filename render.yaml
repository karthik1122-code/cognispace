# render.yaml — Render.com deployment configuration for CogniSpace backend
# Docs: https://render.com/docs/yaml-spec

services:
  - type: web
    name: cognispace
    runtime: node
    region: oregon
    plan: free

    # One package.json at the repo root serves both the Vite app and the API.
    buildCommand: npm ci --omit=dev
    startCommand: node server/server.js

    # Health check endpoint
    healthCheckPath: /health

    envVars:
      - key: NODE_ENV
        value: production

      - key: PORT
        value: 10000

      # ── Set these in the Render Dashboard → Environment ──
      - key: MONGODB_URI
        sync: false   # Render will prompt you to set this secret

      - key: JWT_SECRET
        generateValue: true   # random 256-bit secret; the server refuses to boot in production without one

      # Optional: override the Gemini model and the per-user daily AI cap
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: AI_DAILY_LIMIT
        value: "60"

      - key: GEMINI_API_KEY
        sync: false   # Render will prompt you to set this secret

      # Your Vercel frontend URL (set after Vercel deployment)
      - key: CORS_ORIGINS
        sync: false   # e.g. https://cognispace-sigma.vercel.app

    autoDeploy: true
